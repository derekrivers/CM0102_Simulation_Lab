name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  runtime-binding:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify authority-free runtime binding policy
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        BASH_ENV: /dev/null
        ENV: /dev/null
      run: |
        run_bound_runtime_verifier() {
          /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C /usr/bin/python3 -I -B -c 'import fcntl,hashlib,os,stat,sys; source=os.open(sys.argv[1],os.O_RDONLY|os.O_NOFOLLOW|os.O_CLOEXEC); before=os.fstat(source); raw=os.read(source,262145); after=os.fstat(source); ok=stat.S_ISREG(before.st_mode) and before.st_nlink==1 and before.st_size==len(raw) and len(raw)<=262144 and os.read(source,1)==b"" and (before.st_dev,before.st_ino,before.st_mode,before.st_nlink,before.st_size,before.st_mtime_ns,before.st_ctime_ns)==(after.st_dev,after.st_ino,after.st_mode,after.st_nlink,after.st_size,after.st_mtime_ns,after.st_ctime_ns) and hashlib.sha256(raw).hexdigest()==sys.argv[2]; ok or sys.exit(1); snapshot=os.memfd_create("runtime-binding-verifier",os.MFD_CLOEXEC|os.MFD_ALLOW_SEALING); len(raw)==os.write(snapshot,raw) or sys.exit(1); fcntl.fcntl(snapshot,fcntl.F_ADD_SEALS,fcntl.F_SEAL_SEAL|fcntl.F_SEAL_SHRINK|fcntl.F_SEAL_GROW|fcntl.F_SEAL_WRITE); os.lseek(snapshot,0,os.SEEK_SET); os.set_inheritable(snapshot,True); os.close(source); os.execve("/usr/bin/python3",["/usr/bin/python3","-I","-B","/proc/self/fd/"+str(snapshot)]+sys.argv[3:],{"PATH":"/usr/bin:/bin","LC_ALL":"C","PYTHONDONTWRITEBYTECODE":"1"})' "$GITHUB_WORKSPACE/tools/windows/synthetic-launcher-controller/verify_runtime_binding_policy.py" "3ff6da86cb555091a8fbbcca10ba4ed238798080df2b12d24c56cccb1afcb9ab" "$@"
        }
        run_bound_runtime_verifier self-test
        run_bound_runtime_verifier verify \
          --repo "$GITHUB_WORKSPACE" \
          --source-commit "$GITHUB_SHA"

  build:
    needs: runtime-binding
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Verify harmless Windows fixture sources
      run: |
        python3 tools/windows/synthetic-launcher-qualification/verify_fixture.py self-test
        python3 tools/windows/synthetic-launcher-qualification/verify_fixture.py verify \
          --repo "$GITHUB_WORKSPACE" \
          --source-commit "$GITHUB_SHA" \
          --fixture "$GITHUB_WORKSPACE/tools/windows/synthetic-launcher-qualification/SyntheticFixture.cs" \
          --tests "$GITHUB_WORKSPACE/tools/windows/synthetic-launcher-qualification/SyntheticFixtureTests.cs" \
          --profile "$GITHUB_WORKSPACE/config/synthetic-launcher-fixture-v1.json"
    - name: Verify authority-free controller policy
      run: |
        python3 tools/windows/synthetic-launcher-controller/verify_controller_policy.py self-test
        python3 tools/windows/synthetic-launcher-controller/verify_controller_policy.py verify \
          --repo "$GITHUB_WORKSPACE" \
          --source-commit "$GITHUB_SHA"
    - name: Verify controller runtime contract
      run: |
        python3 tools/windows/synthetic-launcher-controller/verify_controller_runtime_contract.py self-test
        python3 tools/windows/synthetic-launcher-controller/verify_controller_runtime_contract.py verify \
          --repo "$GITHUB_WORKSPACE" \
          --source-commit "$GITHUB_SHA"
    - name: Verify authority-free controller engine
      run: |
        python3 tools/windows/synthetic-launcher-controller/verify_controller_engine.py self-test
        python3 tools/windows/synthetic-launcher-controller/verify_controller_engine.py verify \
          --repo "$GITHUB_WORKSPACE" \
          --source-commit "$GITHUB_SHA"
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  controller-policy-windows:
    needs: runtime-binding
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build and run authority-free x86 policy tests
      shell: pwsh
      run: |
        $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319'
        $compiler = Join-Path $framework 'csc.exe'
        $output = Join-Path $env:RUNNER_TEMP 'ControllerPolicyTests.exe'
        $policy = (Resolve-Path 'tools\windows\synthetic-launcher-controller\ControllerPolicy.cs').Path
        $tests = (Resolve-Path 'tools\windows\synthetic-launcher-controller\ControllerPolicyTests.cs').Path
        & $compiler /nologo /noconfig /warnaserror+ /optimize+ /nostdlib+ /platform:x86 /target:exe `
          /main:Cm0102.SyntheticLauncherController.ControllerPolicyTests `
          "/reference:$framework\mscorlib.dll" "/reference:$framework\System.dll" "/out:$output" `
          $policy $tests
        if ($LASTEXITCODE -ne 0) { throw 'policy compilation failed' }
        $actual = (& $output | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or $actual -cne 'PASS 2601') { throw "unexpected policy result: $actual" }
    - name: Build and run authority-free x86 engine tests
      shell: pwsh
      run: |
        $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319'
        $compiler = Join-Path $framework 'csc.exe'
        $output = Join-Path $env:RUNNER_TEMP 'ControllerEngineTests.exe'
        $policy = (Resolve-Path 'tools\windows\synthetic-launcher-controller\ControllerPolicy.cs').Path
        $engine = (Resolve-Path 'tools\windows\synthetic-launcher-controller\ControllerEngine.cs').Path
        $tests = (Resolve-Path 'tools\windows\synthetic-launcher-controller\ControllerEngineTests.cs').Path
        & $compiler /nologo /noconfig /warnaserror+ /optimize+ /nostdlib+ /platform:x86 /target:exe `
          /main:Cm0102.SyntheticLauncherController.ControllerEngineTests `
          "/reference:$framework\mscorlib.dll" "/reference:$framework\System.dll" "/out:$output" `
          $policy $engine $tests
        if ($LASTEXITCODE -ne 0) { throw 'engine compilation failed' }
        $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
        $startInfo.FileName = $output
        $startInfo.UseShellExecute = $false
        $startInfo.RedirectStandardOutput = $true
        $startInfo.RedirectStandardError = $true
        $process = [System.Diagnostics.Process]::new()
        $process.StartInfo = $startInfo
        if (-not $process.Start()) { throw 'engine test start failed' }
        if (-not $process.WaitForExit(30000)) {
          $process.Kill()
          throw 'engine test timed out'
        }
        $actual = $process.StandardOutput.ReadToEnd().Trim()
        $diagnostics = $process.StandardError.ReadToEnd().Trim()
        if ($process.ExitCode -ne 0 -or $diagnostics -cne '' -or $actual -cne 'PASS 1235') {
          throw "unexpected engine result: $actual"
        }
    - name: Build and run authority-free x86 runtime binding tests
      shell: pwsh
      run: |
        $framework = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319'
        $compiler = Join-Path $framework 'csc.exe'
        $output = Join-Path $env:RUNNER_TEMP 'RuntimeBindingPolicyTests.exe'
        $policy = (Resolve-Path 'tools\windows\synthetic-launcher-controller\RuntimeBindingPolicy.cs').Path
        $tests = (Resolve-Path 'tools\windows\synthetic-launcher-controller\RuntimeBindingPolicyTests.cs').Path
        & $compiler /nologo /noconfig /warnaserror+ /optimize+ /nostdlib+ /platform:x86 /target:exe `
          /main:Cm0102.SyntheticLauncherController.RuntimeBindingPolicyTests `
          "/reference:$framework\mscorlib.dll" "/reference:$framework\System.dll" "/out:$output" `
          $policy $tests
        if ($LASTEXITCODE -ne 0) { throw 'runtime binding compilation failed' }
        $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
        $startInfo.FileName = $output
        $startInfo.UseShellExecute = $false
        $startInfo.RedirectStandardOutput = $true
        $startInfo.RedirectStandardError = $true
        $process = [System.Diagnostics.Process]::new()
        $process.StartInfo = $startInfo
        if (-not $process.Start()) { throw 'runtime binding test start failed' }
        if (-not $process.WaitForExit(30000)) {
          $process.Kill()
          throw 'runtime binding test timed out'
        }
        $actual = $process.StandardOutput.ReadToEnd().Trim()
        $diagnostics = $process.StandardError.ReadToEnd().Trim()
        if ($process.ExitCode -ne 0 -or $diagnostics -cne '' -or $actual -cne 'PASS 202') {
          throw "unexpected runtime binding result: $actual"
        }
